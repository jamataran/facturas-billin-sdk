name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # Detect which packages have changed
  changes:
    runs-on: ubuntu-latest
    outputs:
      java: ${{ steps.filter.outputs.java }}
      php: ${{ steps.filter.outputs.php }}
      openapi: ${{ steps.filter.outputs.openapi }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            java:
              - 'packages/java-sdk/**'
            php:
              - 'packages/php-sdk/**'
            openapi:
              - 'openapi-spec/**'

  # Java tests with matrix strategy
  test-java:
    needs: changes
    if: ${{ needs.changes.outputs.java == 'true' || needs.changes.outputs.openapi == 'true' || github.event_name == 'push' }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        java-version: ['11', '17', '21']

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Install dependencies
        run: npm ci

      - name: Generate Java SDK
        run: npm run generate:java

      - name: Run Java tests
        env:
          BILLIN_CLIENT_ID: ${{ secrets.BILLIN_CLIENT_ID }}
          BILLIN_CLIENT_SECRET: ${{ secrets.BILLIN_CLIENT_SECRET }}
        run: npm run test:java

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-java-${{ matrix.java-version }}
          path: packages/java-sdk/target/surefire-reports/
          retention-days: 30

  # PHP tests with matrix strategy
  test-php:
    needs: changes
    if: ${{ needs.changes.outputs.php == 'true' || needs.changes.outputs.openapi == 'true' || github.event_name == 'push' }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        php-version: ['7.4', '8.0', '8.1', '8.2', '8.3']

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: curl, json, mbstring
          tools: composer:v2
          coverage: none

      - name: Install npm dependencies
        run: npm ci

      - name: Generate PHP SDK
        run: npm run generate:php

      - name: Install PHP dependencies
        working-directory: packages/php-sdk
        run: composer install --prefer-dist --no-progress

      - name: Run PHP tests
        working-directory: packages/php-sdk
        env:
          BILLIN_CLIENT_ID: ${{ secrets.BILLIN_CLIENT_ID }}
          BILLIN_CLIENT_SECRET: ${{ secrets.BILLIN_CLIENT_SECRET }}
        run: vendor/bin/phpunit --testsuite Unit,Integration
        continue-on-error: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-php-${{ matrix.php-version }}
          path: packages/php-sdk/coverage/
          retention-days: 30
