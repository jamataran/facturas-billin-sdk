name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'
          cache: 'maven'
          
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: curl, json, mbstring
          
      - name: Install dependencies
        run: npm ci
        
      - name: Generate Java SDK only
        run: npm run generate:java

      - name: Build Java SDK
        working-directory: packages/java-sdk
        run: mvn -B clean compile -DskipTests

      - name: Verify SDK structure
        run: |
          echo "✅ Verificando estructura del SDK Java..."
          test -f packages/java-sdk/pom.xml && echo "  - pom.xml encontrado"
          test -d packages/java-sdk/src/main/java && echo "  - src/main/java encontrado"
          echo "✅ Estructura verificada correctamente"
