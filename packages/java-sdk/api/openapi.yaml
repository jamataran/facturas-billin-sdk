        updatedAt:
          description: The date when the accounting account was last updated
          example: 2024-03-04T00:00:00Z
          format: date-time
          type: string
        type:
          description: "Type of the accounting account: bank account, credit card\
            \ or cash register"
          enum:
          - BANK_ACCOUNT
          - CASH_REGISTER
          - CREDIT_CARD
          example: BANK_ACCOUNT
          type: string
        alias:
          description: Name given by the user to be able to identify the account
          example: Cuenta Banco Popular B
          type: string
        IBAN:
          description: IBAN of the accounting account in case it has the bank account
            type
          example: ES7221002792116644245555
          nullable: true
          type: string
        swiftCode:
          description: SWIFT code of the accounting account in case it has the bank
            account type
          example: BBVAESBB620
          nullable: true
          type: string
        creditCardNumber:
          description: Credit card number of the accounting account in case it has
            the credit card type
          example: "4249287503791846"
          nullable: true
          type: string
        creditCardExpireDate:
          description: Expiration date of the credit card in case it has the credit
            card type
          example: 01/2023
          nullable: true
          type: string
      required:
      - alias
      - createdAt
      - id
      - type
      - updatedAt
      type: object
