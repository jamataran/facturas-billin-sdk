          enum:
          - client_credentials
          - refresh_token
          - password
          example: client_credentials
          type: string
        clientId:
          example: my client id
          type: string
        clientSecret:
          example: my client secret key
          type: string
        refreshToken:
          example: refresh token
          type: string
        username:
          description: Required if grantType is 'password'
          example: username
          type: string
        password:
          description: Required if grantType is 'password'
          example: password
          type: string
      required:
      - clientId
      type: object
