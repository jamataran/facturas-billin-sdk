openapi: 3.0.0
info:
  contact: {}
  description: The integration API documentation
  title: Billin Api
  version: "1.0"
servers:
- url: https://api.billin.net
paths:
  /v1/auth/token:
    post:
      description: "Endpoint that validates credentials following the flows specified\
        \ in OAuth2. If validates succesfully, returns an access token and a refresh\
        \ token"
      operationId: AuthController_getToken_v1
      parameters: []
      requestBody:
        content:
          application/json:
            examples:
              Client Credentials:
                description: "Example to authenticate with [client credentials flow](https://auth0.com/docs/get-started/authentication-and-authorization-flow/client-credentials-flow)"
                value:
                  grantType: client_credentials
                  clientId: <your client id>
                  clientSecret: <your client secret>
              Password:
                description: "Example to authenticate with owner [password flow](https://auth0.com/docs/get-started/authentication-and-authorization-flow/resource-owner-password-flow)"
                value:
                  grantType: password
                  clientId: <your client id>
                  clientSecret: <your client secret>
                  username: <username>
                  password: <password>
              Refresh Token:
                description: "Example to authenticate with [refresh token flow](https://auth0.com/docs/secure/tokens/refresh-tokens/use-refresh-tokens)"
                value:
                  grantType: refresh_token
                  clientId: <your client id>
                  refreshToken: <refresh token>
            schema:
              $ref: '#/components/schemas/RequestTokenUserApiCredentialDto'
        description: "Currently there are three authentication flows: client_credentials,\
          \ password and refresh_token. Not all of them are available to all users"
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenAnswerDto'
          description: ""
        "400":
          content:
            application/json:
              examples:
                validationErrors:
                  summary: Validation errors
                  value:
                    statusCode: 400
                    message: BadRequestException
                    type: validation-errors
                    description: Some errors were found in the request schema.
                    errors:
                    - clientId should not be null or undefined
                    - clientId must be a string
                    - clientSecret should not be null or undefined
                    - clientSecret must be a string
              schema:
                $ref: '#/components/schemas/ApiBadRequestException'
          description: ""
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiUnauthorizedException'
          description: ""
      summary: OAuth2 authentication
      tags:
      - Auth
      x-content-type: application/json
      x-accepts: application/json
  /v1/auth/info:
    get:
      description: Endpoint that gets the basic info from the user that generated
        the API credentials
      operationId: AuthController_getInfo_v1
      parameters: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthInfoAnswerDto'
          description: ""
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthInfoAnswerDto'
          description: ""
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiUnauthorizedException'
          description: ""
      security:
      - bearer: []
      summary: Get user info
      tags:
      - Auth
      x-accepts: application/json
  /v1/invoices:
    get:
      description: Endpoint to get the invoices and sales receipts list
      operationId: getInvoicesList
      parameters:
      - explode: true
        in: query
        name: "query[documentType]"
        required: false
        schema:
          default:
          - INVOICE
          - CORRECTIVE
          - TEST_INVOICE
          example:
          - INVOICE
          - CORRECTIVE
          items:
            enum:
            - INVOICE
            - CORRECTIVE
            - TEST_INVOICE
            type: string
          type: array
        style: form
      - description: "Allowed values: \n      \n- DRAFT \n      \n- ISSUED\n     \
          \ \n- VOID\n      \n- CORRECTED: The invoice has been corrected with another\
          \ invoice (a corrective invoice)\n      \n- REPLACED: The simplified invoice\
          \ has been replaced with a standard invoice"
        explode: true
        in: query
        name: "query[status]"
        required: false
        schema:
          default:
          - DRAFT
          - ISSUED
          - VOID
          - CORRECTED
          - REPLACED
          example:
          - ISSUED
          items:
            enum:
            - DRAFT
            - ISSUED
            - VOID
            - CORRECTED
            - REPLACED
            type: string
          type: array
        style: form
      - description: |-
          You can filter by a date range using one of the following operators:

          - $gt: greater than

          - $gte: greater than or equal

          - $lt: lower than

          - $lte: lower than or equal

          Example: query[date][$gt]=2023-01-01&query[date][$lt]=2023-02-01
        explode: true
        in: query
        name: "query[issuedDate]"
        required: false
        schema:
          type: string
        style: form
      - description: |-
          You can filter by a date range using one of the following operators:

          - $gt: greater than

          - $gte: greater than or equal

          - $lt: lower than

          - $lte: lower than or equal

          Example: query[date][$gt]=2023-01-01&query[date][$lt]=2023-02-01
        explode: true
        in: query
        name: "query[createdAt]"
        required: false
        schema:
          type: string
        style: form
      - description: |-
          You can filter by a date range using one of the following operators:

          - $gt: greater than

          - $gte: greater than or equal

          - $lt: lower than

          - $lte: lower than or equal

          Example: query[date][$gt]=2023-01-01&query[date][$lt]=2023-02-01
        explode: true
        in: query
        name: "query[updatedAt]"
        required: false
        schema:
          type: string
        style: form
      - explode: true
        in: query
        name: "query[serialCode]"
        required: false
        schema:
          type: string
        style: form
      - explode: true
        in: query
        name: "query[code]"
        required: false
        schema:
          type: number
        style: form
      - explode: true
        in: query
        name: "query[isPaid]"
        required: false
        schema:
          type: boolean
        style: form
      - explode: true
        in: query
        name: "query[contact][vatNumber]"
        required: false
        schema:
          type: string
        style: form
      - explode: true
        in: query
        name: "query[reference]"
        required: false
        schema:
          type: string
        style: form
      - description: "When this parameter is not provided, or is false, only invoices\
          \ prior to the Verifactu regulation are returned. If true, then only Verifactu\
          \ type invoices are returned"
        explode: true
        in: query
        name: "query[getVerifactuInvoices]"
        required: false
        schema:
          type: boolean
        style: form
      - explode: true
        in: query
        name: "sort[issuedDate]"
        required: false
        schema:
          enum:
          - ASC
          - DESC
          type: string
        style: form
      - explode: true
        in: query
        name: "sort[createdAt]"
        required: false
        schema:
          enum:
          - ASC
          - DESC
          type: string
        style: form
      - explode: true
        in: query
        name: "sort[updatedAt]"
        required: false
        schema:
          enum:
          - ASC
          - DESC
          type: string
        style: form
      - explode: true
        in: query
        name: "sort[serialCode]"
        required: false
        schema:
          enum:
          - ASC
          - DESC
          type: string
        style: form
      - explode: true
        in: query
        name: "sort[code]"
        required: false
        schema:
          enum:
          - ASC
          - DESC
          type: string
        style: form
      - explode: true
        in: query
        name: "sort[reference]"
        required: false
        schema:
          enum:
          - ASC
          - DESC
          type: string
        style: form
      - explode: true
        in: query
        name: limit
        required: false
        schema:
          default: 10
          example: 10
          maximum: 100
          minimum: 0
          type: number
        style: form
      - explode: true
        in: query
        name: offset
        required: false
        schema:
          example: 0
          type: number
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetInvoicesListAnswerDto'
          description: ""
        "400":
          content:
            application/json:
              examples:
                NotValidDocumentType:
                  summary: Not Valid Document Type
                  value:
                    statusCode: 400
                    message: BadRequestException
                    type: validation-error
                    description: Some errors were found in the request schema
                    errors:
                    - "This documentType value is not valid. Valid values are INVOICE,\
                      \ TEST_INVOICE and CORRECTIVE"
              schema:
                $ref: '#/components/schemas/ApiBadRequestException'
          description: ""
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiUnauthorizedException'
          description: ""
      security:
      - bearer: []
      summary: Get the invoices or sales receipts list
      tags:
      - Invoices
      x-accepts: application/json
