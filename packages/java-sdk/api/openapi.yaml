            \ at a later time.<br>ISSUED -> It’s an oficial document that records\
            \ the products or services delivered to the customer, the total amount\
            \ due, and the preferred payment method.<br>VOID -> A voided invoice retains\
            \ its invoice number and will continue to appear, but does not generate\
            \ any accounting or tax information.<br>CORRECTIVE -> It’s an issued document\
            \ to correct an invoice, make a refund or recover VAT on an unpaid invoice.<br>REPLACED\
            \ -> It is a receipt that has been substituted by an invoice."
          enum:
          - DRAFT
