            \ second INT is for the decimal part of the tax rate.\nThe NONTAXABLETAXTYPE\
            \ can be Exempt, NotSubject or ReverseCharge.\nFor the NONTAXABLETAXTYPE\
            \ the INT must be 0.\nSome examples are: IVA_Exempt_0, IVA_21, IPSI_3,\
            \ IGIC_7_5"
          example: IVA_21
          type: string
        taxBase:
          description: "Price without taxes. If not provided, it will be calculated"
          example: 18
          type: number
        taxPercentage:
          description: "Tax amount. If not provided, it will be calculated"
          example: 21
          type: number
        taxAmount:
          description: Amount tax to be deducted from the price
          example: 3.78
          type: number
        salesEqTaxPercentage:
          description: "Sales equivalent tax percentage. In Spain it is called \"\
            Porcentaje de Recargoo de equivalencia\". If not provided, it will be\
            \ calculated"
          example: 0
          type: number
        salesEqTaxAmount:
          description: Sales equivalent tax amount. In Spain it is called "Cantidad
            de Recargoo de equivalencia"
          example: 0
          type: number
        productId:
          description: Product Id
          example: ae69f822-12e5-4285-ba1d-22624e32d078
          nullable: true
          type: string
        productReference:
          description: Product reference
          example: "123"
          nullable: true
          type: string
        taxExemptionCause:
          description: Tax exemption cause
          enum:
          - E1
          - E2
          - E3
          - E4
          - E5
          - E6
          - OT
          - RL
          - VT
          - IE
          example: E6
          type: string
        operation:
          description: Operation
          enum:
          - SALES_GOODS
          - PROVISION_OF_SERVICES
          example: PROVISION_OF_SERVICES
          type: string
        order:
          type: number
      required:
      - discountAmount
      - name
      - quantity
      - salesEqTaxAmount
      - taxAmount
      - taxKey
      - totalAmount
      - unitPrice
      type: object
    DocumentContactBaiDto:
      properties:
        fiscalName:
          description: The fiscal name of the contact
          example: Contact S.L.
          maxLength: 120
          minLength: 1
          type: string
        taxKey:
          description: "It must have the format TAXTYPE_INT, TAXTYPE_INT_INT or TAXTYPE_NONTAXABLETAXTYPE_INT.\
            \ \nThe TAXTYPE can be IVA, IPSI or IGIC.\nINT is the tax rate and the\
            \ second INT is for the decimal part of the tax rate.\nThe NONTAXABLETAXTYPE\
            \ can be Exempt, NotSubject or ReverseCharge.\nFor the NONTAXABLETAXTYPE\
            \ the INT must be 0.\nSome examples are: IVA_Exempt_0, IVA_21, IPSI_3,\
            \ IGIC_7_5"
          example: IVA_7_5
          type: string
        email:
          description: The email of the contact
          example: info@billin.eu
          format: email
          maxLength: 64
          type: string
        phone:
          description: Phone of the contact
          example: "916726763"
          maxLength: 64
          type: string
        salesEqTaxCheck:
          description: Boolean indicating if the sales equivalent tax should be checked
          example: true
          type: boolean
        vatNumberType:
          description: The type of the VAT Identification number of the contact
          enum:
          - NIF
          - NIF-IVA
          - PASSPORT
          - ORIGIN
          - CERTIFICATE
          - OTHER
          example: NIF
          type: string
        vatNumber:
          description: Fiscal identification of the contact
          example: B12345678
          type: string
        address:
          allOf:
          - $ref: '#/components/schemas/DocumentContactAddressDto'
          description: The address of the contact
      required:
      - address
      - fiscalName
      - vatNumber
      - vatNumberType
      type: object
    InvoiceBaiCreateDto:
      properties:
        serieId:
          description: "The id of the serie. If provided together with serialCode,\
            \ the serieId will be used"
          example: 5f7b1b3b-5b9a-4b0a-8b0a-0b9a5b7b1f7b
          type: string
        serialCode:
          description: "Serial Code of the document. If provided together with serieId,\
            \ the serieId will be used"
          example: F2023
          type: string
        code:
          description: Code/Number of the document
          example: 1
          maximum: 1000000000
          minimum: 0
          type: number
        mask:
          description: "Mask used on the code of the document. The complete invoice\
            \ identifier number is built from the serial code and the code. For example,\
            \ for a serial code \"F2023\" and a code \"1\" the full identifier number\
            \ that will appear in the PDF will be \"F20231\". The mask allows for\
            \ leading zeros to be included when constructing the complete ID number\
            \ in the PDF. If we put a mask of 3, the full ID number will be \"F2023001\""
          example: 3
          maximum: 1000000000
          minimum: 0
          type: number
        issuedDate:
          description: The date when the documen was issued
          example: 2021-01-01
